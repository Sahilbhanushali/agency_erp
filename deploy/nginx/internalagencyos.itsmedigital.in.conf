# AgencyOS — internalagencyos.itsmedigital.in
#
# One origin serves both halves:
#   /api/*  -> NestJS on 127.0.0.1:5417
#   /*      -> the Vite build, with SPA fallback
#
# The /api prefix is not optional. The API mounts its controllers at the root
# (/auth, /dashboard, /leads, /approvals, /tasks ...) and the SPA claims those
# exact paths too, so they can only coexist if nginx separates them. The trailing
# slash on proxy_pass below strips /api before the request reaches Nest.
#
# Install:
#   sudo ln -s /var/www/projects/itsme/deploy/nginx/internalagencyos.itsmedigital.in.conf \
#              /etc/nginx/sites-enabled/internalagencyos.itsmedigital.in
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d internalagencyos.itsmedigital.in

server {
    listen 80;
    listen [::]:80;
    server_name internalagencyos.itsmedigital.in;

    root /var/www/projects/itsme/frontend/dist;
    index index.html;

    access_log /var/log/nginx/itsme-agencyos.access.log;
    error_log  /var/log/nginx/itsme-agencyos.error.log;

    # Employee documents and post media go through the API, so the request body
    # limit has to clear the largest file anyone will upload.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API -----------------------------------------------------------------
    # ^~ so this wins over any regex location; the trailing slash on proxy_pass
    # rewrites /api/auth/login -> /auth/login.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5417/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # PDF and document downloads stream straight through.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Static assets -------------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA -----------------------------------------------------------------
    # index.html must never be cached, or a deploy keeps serving the old bundle
    # and its references to asset files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing under the app root should reach dotfiles.
    location ~ /\. {
        deny all;
    }
}
