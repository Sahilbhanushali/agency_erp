# /etc/nginx/sites-available/internalagencyos.itsmedigital.in.conf
#
# itsmeDezino Agency ERP (Next.js). One Node process — PM2 "itsmedezinoagencyerp" on
# 127.0.0.1:3008 — serves BOTH the pages and /api/**, so there is no `root` and no
# `try_files` anywhere in this file.
#
# HTTP only, on purpose: add SSL yourself once this answers on port 80.
#
# Nothing here touches api.itsmedezino.com (the old Nest stack) or itsmedezino.com
# (the marketing website). This is a brand-new vhost on a brand-new host.

server {
    listen 80;
    listen [::]:80;

    server_name internalagencyos.itsmedigital.in;

    # Webroot ACME challenge, matching the other vhosts on this box
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Image and asset uploads. nginx defaults to 1M, which rejects most of them.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;

        # Host must be passed through unchanged: NextAuth validates its callback URLs
        # against it, and middleware.ts reads it to route client share links.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads and Excel exports can outrun the 60s the old API used
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # No /_next/static/ block on purpose: Next already serves that path with
    # Cache-Control: public, max-age=31536000, immutable.
}
